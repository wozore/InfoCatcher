<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>InfoCatcher OG Image Template</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    background: #1a1d23;
    display: flex; flex-direction: column;
    border: 16px solid #2563eb;
  }
  .main {
    flex: 1; display: flex; flex-direction: column; justify-content: center;
    padding: 60px 80px 40px;
  }
  .icon { font-size: 56px; margin-bottom: 20px; }
  .title {
    font-size: 56px; font-weight: 700; color: #ffffff;
    letter-spacing: 2px; margin-bottom: 16px;
  }
  .subtitle {
    font-size: 30px; font-weight: 400; color: rgba(255,255,255,0.72);
    line-height: 1.5;
  }
  .footer {
    height: 8px; background: #059669;
  }
  .highlight { color: #60a5fa; }
</style>
</head>
<body>
  <div class="main">
    <div class="icon">🔍</div>
    <div class="title"><span class="highlight">Info</span>Catcher</div>
    <div class="subtitle">汇集主流 AI 工具、模型与使用场景</div>
  </div>
  <div class="footer"></div>
</body>
</html>
