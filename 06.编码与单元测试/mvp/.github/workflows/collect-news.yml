name: Collect AI News

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      platform_scope:
        description: '本次采集范围（诊断 B站时选择 bilibili-only）'
        required: true
        default: all
        type: choice
        options:
          - all
          - bilibili-only

permissions:
  contents: write

concurrency:
  group: collect-ai-news
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate source configuration
        run: node scripts/validate.js

      - name: Collect and build news
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          NEWS_PLATFORM_SCOPE: ${{ github.event.inputs.platform_scope || 'all' }}
        run: node scripts/build-news.js

      - name: Test generated data
        run: |
          node --test scripts/news-tests.test.js scripts/news-foundation.test.js
          node scripts/validate.js

      - name: Commit generated data
        run: |
          if git diff --quiet -- data/news/output/hotspots.json data/news/runtime/news-state.json data/news/runtime/news-registry.json data/news/runtime/news-quota.json data/news/runtime/pending-authorizations.json; then
            echo "No generated data changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news/output/hotspots.json data/news/runtime/news-state.json data/news/runtime/news-registry.json data/news/runtime/news-quota.json data/news/runtime/pending-authorizations.json
          git commit -m "chore(data): update AI hotspots"
          git push
