name: 数据纠错
description: 报告某个 AI 工具的信息过时或错误
title: "[数据纠错] "
labels: ["data-correction"]
body:
  - type: markdown
    attributes:
      value: |
        请提供可核验来源，并确认没有提交 API Key、Cookie、密码、个人资料或安全漏洞细节；安全问题请查看 [安全政策](../../SECURITY.md)。
  - type: input
    id: tool_name
    attributes:
      label: 工具名称
      description: 哪个工具的信息需要修正？
      placeholder: 例如：ChatGPT、DeepSeek
    validations:
      required: true
  - type: dropdown
    id: field
    attributes:
      label: 需要修正的字段
      options:
        - 价格/免费层
        - 功能描述
        - 评分
        - 适用场景
        - 访问门槛
        - 官网链接
        - 其他
    validations:
      required: true
  - type: textarea
    id: current_info
    attributes:
      label: 当前信息
      description: 知览上某个 AI 工具或模型的信息需要修正，请提供可核验来源
    validations:
      required: true
  - type: textarea
    id: correct_info
    attributes:
      label: 正确信息
      description: 正确的信息应该是什么？
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: 信息来源
      description: 请提供官方链接、截图或其他可验证的来源
      placeholder: "https://..."
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: 补充说明
      description: 其他需要说明的内容（选填）
