name: 产品反馈与建议
description: 分享知览在真实任务中的使用反馈或改进建议
title: "[反馈] "
labels: ["feedback"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。这里适合讨论使用体验、信息呈现和功能方向；数据事实错误请使用数据纠错入口。安全漏洞、API Key、Cookie、密码和个人敏感信息不要提交到公开 Issue，请查看 [安全政策](../../SECURITY.md)。
  - type: textarea
    id: task
    attributes:
      label: 你想完成什么任务
      description: 请描述实际想完成的事情，而不只是想要的按钮或功能。
      placeholder: 例如：我想快速比较几个模型，判断哪个适合长文总结。
    validations:
      required: true
  - type: textarea
    id: obstacle
    attributes:
      label: 当前遇到的阻碍
      description: 哪一步不清楚、做不到或与预期不一致？
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: 建议或期望结果
      description: 你希望知览如何帮助完成这个任务？
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 设备与浏览器
      description: 如果反馈与页面体验有关，请填写操作系统、设备和浏览器版本。
      placeholder: 例如：Android 15 / Chrome 140
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我没有在此 Issue 中提交密码、Cookie、API Key、个人敏感信息或安全漏洞细节。
          required: true
