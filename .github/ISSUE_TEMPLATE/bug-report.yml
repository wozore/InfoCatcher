name: 站点 Bug
description: 报告知览页面或交互功能异常（不用于提交安全漏洞）
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。安全漏洞、API Key、Cookie、密码和个人敏感信息不要提交到公开 Issue，请查看 [安全政策](../../SECURITY.md)。
  - type: input
    id: page
    attributes:
      label: 页面或功能
      description: 哪个页面、视图或交互出现问题？
      placeholder: 例如：模型对比、移动端工具库筛选
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 设备与浏览器
      description: 请填写操作系统、设备类型和浏览器版本。
      placeholder: 例如：Windows 11 / Edge 140
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请按顺序描述如何触发问题。
      placeholder: |
        1. 打开……
        2. 点击……
        3. 看到……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 截图或其他信息
      description: 可选。上传前请移除账号、密钥、个人资料和其他敏感信息。
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我没有在此 Issue 中提交密码、Cookie、API Key、个人敏感信息或安全漏洞细节。
          required: true
        - label: 我已确认这不是数据内容纠错；如是数据问题，我会使用数据纠错入口。
          required: true
