name: Refresh VibeHub Cache

on:
  schedule:
    # GitHub Actions cron 固定按 UTC；北京时间 = UTC + 8h。
    # YouTube 采集 = 每天北京 20:00 → UTC 12:00（是否真正采集由管线 72h 到期闸决定，见 collect-news.yml）。
    # 本任务在采集前 1h 刷新 vibe-hub 概念缓存：每天北京 19:00 → UTC 11:00；
    # 缓存全新鲜时零网络直接跳过，每日触发无额外成本。
    - cron: '0 11 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-vibe-hub-cache
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Refresh stale cache entries
        run: node scripts/refresh-vibe-hub-cache.js

      - name: Validate data and scan secrets
        run: |
          node scripts/validate.js
          node scripts/check-secrets.js

      - name: Commit updated cache
        run: |
          if git diff --quiet -- data/manual/registries/vibe-hub-cache.json; then
            echo "No cache changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/manual/registries/vibe-hub-cache.json
          git commit -m "chore(data): refresh vibe-hub concept cache"
          git push
